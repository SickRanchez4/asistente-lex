[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-04-ia"
version = "0.1.0"
description = "MS-04 IA, chat y agentes de Asistente Lex."
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic-settings==2.16.2",
    "pymongo==4.19.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
