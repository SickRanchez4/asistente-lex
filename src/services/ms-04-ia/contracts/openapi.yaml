openapi: 3.1.1
info:
  title: MS-04 IA
  version: 1.0.0
  description: |
    Contrato REST vigente de MS-04. Cada spec funcional añade aquí sus operaciones
    antes de integrarlas. Convenciones y errores en ../../contracts/common.yaml.
    Las operaciones de IA respetan X-Lex-Deadline-Ms como presupuesto total.
servers:
  - url: http://localhost:8084
security:
  - serviceToken: []
    userContext: []
paths:
  /cases/{caseId}/report-proposal:
    post:
      summary: Proponer informe completo sin persistirlo ni consultar informes anteriores.
      description: Solo propietario vigente, OPEN/CLOSED sin archivo pendiente. Revalida contexto cerrado contra MS01/MS02; CLIENT no admite PDF. Captura agente inicial o alternativa explicita habilitada, sin fallback. Presupuesto restante de 60000 ms, JSON completo sin streaming/reintento.
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, context]
              properties:
                kind: { type: string, enum: [EXECUTIVE, CLIENT, NATURAL] }
                agentId: { type: [string, 'null'], enum: [civilista, penalista, null] }
                question: { type: string, maxLength: 8000 }
                filter: { type: object, properties: { actuationType: { type: [string, 'null'] }, fromDate: { type: [string, 'null'], format: date }, toDate: { type: [string, 'null'], format: date } }, additionalProperties: false }
                context: { type: object, required: [legal, pdfs], properties: { legal: { type: object }, pdfs: { type: array, maxItems: 10, items: { type: object } } }, additionalProperties: false }
      responses:
        '200':
          description: Propuesta validada con title, sections (heading/body), table tipada o null, sourceIds autorizados y agent real; sin ID de informe ni escritura en MongoDB.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [title, sections, table, sourceIds, agent, lawSources]
                properties:
                  title: { type: string, maxLength: 180 }
                  sections: { type: array, minItems: 1, maxItems: 12, items: { type: object, required: [heading, body], properties: { heading: { type: string, maxLength: 150 }, body: { type: string, maxLength: 12000 } }, additionalProperties: false } }
                  table:
                    type: [object, 'null']
                    additionalProperties: false
                    required: [columns, rows]
                    properties:
                      columns: { type: array, minItems: 1, maxItems: 12, items: { type: object, required: [key, label, type], properties: { key: { type: string }, label: { type: string }, type: { type: string, enum: [TEXT, DATE, AMOUNT, NUMBER, BOOLEAN] } }, additionalProperties: false } }
                      rows: { type: array, maxItems: 200, items: { type: array, items: { type: string, maxLength: 2000 } } }
                  sourceIds: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
                  lawSources: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ChatSource' }, description: Solo fuentes LAW de la biblioteca capturada en MS-04; nunca texto ni fuentes aportadas por el cliente. }
                  agent: { type: object, required: [id, name], properties: { id: { type: string, enum: [civilista, penalista] }, name: { type: string } }, additionalProperties: false }
        default: { $ref: '#/components/responses/ChatError' }
  /cases/{caseId}/conversations:
    parameters: [{ $ref: '#/components/parameters/ChatCaseId' }]
    get:
      summary: Conversaciones privadas paginadas; solo propietario vigente, OPEN/CLOSED sin archivo pendiente.
      description: Orden createdAt DESC, id DESC. Cursor es ID de conversacion de esta cuenta/caso. No incluye intercambios.
      parameters:
        - { name: first, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: after, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina privada no-store.
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ConversationSummary' } }
                  pageInfo:
                    type: object
                    required: [hasNextPage, endCursor]
                    properties:
                      hasNextPage: { type: boolean }
                      endCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/ChatError' }
    post:
      summary: Iniciar con agente inicial vigente; alternativa habilitada solo si se elige explicitamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                agentId: { type: [string, 'null'], enum: [penalista, civilista, null] }
      responses:
        '200': { description: Conversacion nueva sin intercambio, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/ChatError' }
  /cases/{caseId}/conversations/{conversationId}:
    parameters: [{ $ref: '#/components/parameters/ChatCaseId' }, { $ref: '#/components/parameters/ConversationId' }]
    get:
      summary: Conversacion propia con intercambios completos ordenados, nunca estados parciales.
      responses:
        '200': { description: Historial privado no-store, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/ChatError' }
  /cases/{caseId}/conversations/{conversationId}/agent:
    parameters: [{ $ref: '#/components/parameters/ChatCaseId' }, { $ref: '#/components/parameters/ConversationId' }]
    put:
      summary: Cambiar agente habilitado con version; no cambia expediente ni otras conversaciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId, expectedVersion]
              properties:
                agentId: { type: string, enum: [penalista, civilista] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Conversacion vigente, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/ChatError' }
  /cases/{caseId}/conversations/{conversationId}/questions:
    parameters: [{ $ref: '#/components/parameters/ChatCaseId' }, { $ref: '#/components/parameters/ConversationId' }]
    post:
      summary: Respuesta completa OpenAI sin streaming ni reintentos; intercambio atomico con fuentes verificadas.
      description: |
        Presupuesto total configurable 60000 ms, propagado a fuentes y proveedor. Pregunta de hasta
        8000 caracteres, respuesta hasta 50000 y contexto/historial acotado sin truncamiento silencioso.
        Captura configuracion habilitada al admitir; deshabilitar despues no cancela, archivar si.
        Bloqueo local por expediente sin sostenerlo durante OpenAI. Fallo/timeout/referencia inventada
        no persiste un intercambio. Documento especifico requiere CASE_PDF_TEXT y texto extraible.
        Herramientas cerradas: datos juridicos sin notas, lista solo PDF, lectura texto PDF autorizado.
        Sin OCR, imagenes, informes, ERP, normativa web, MCP o URLs escogidas por el modelo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, expectedVersion, scope]
              properties:
                question: { type: string, minLength: 1, maxLength: 8000 }
                expectedVersion: { type: integer, minimum: 1 }
                scope: { type: string, enum: [CASE, PDF] }
                documentId: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: Intercambio completo persistido; agente y fuentes efectivamente usadas, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/ChatError' }
  /cases/{id}/conversations/delete:
    post:
      summary: Borrado completo idempotente para archivo de 007, con generacion y recibo durable por intento.
      description: |
        Solo solicitud interna de MS-01 con contexto firmado de Abogado propietario ya autorizado.
        No volver a consultar MS-01 dentro del borrado: evitar dependencia circular.
        Serializar en la instancia local por cuenta/expediente con admision/persistencia;
        avanzar generacion e impedir que respuestas previas vuelvan a persistir. Borrar todas
        las conversaciones, intercambios y estados. Repetir archiveAttemptId confirma el mismo
        borrado sin borrar chats nuevos despues de desarchivo; persistir recibo tecnico del intento.
        Confirmar solo al terminar, no al aceptar. Respetar X-Lex-Deadline-Ms. Ante error/timeout,
        MS-01 conserva la marca tecnica y no informa archivo confirmado.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archiveAttemptId]
              properties:
                archiveAttemptId: { type: string, format: uuid }
      responses:
        '200':
          description: Borrado completo confirmado para esa cuenta, expediente e intento.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted, caseId, archiveAttemptId, generation]
                properties:
                  deleted: { type: boolean, const: true }
                  caseId: { type: string, format: uuid }
                  archiveAttemptId: { type: string, format: uuid }
                  generation: { type: integer, minimum: 1 }
        '400': { $ref: '../../contracts/common.yaml#/components/responses/Validation' }
        '401': { $ref: '../../contracts/common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../../contracts/common.yaml#/components/responses/Forbidden' }
        '503': { $ref: '../../contracts/common.yaml#/components/responses/ServiceUnavailable' }
  /health:
    get:
      summary: Comprobación técnica de MongoDB.
      security: []
      responses:
        '200':
          $ref: '../../contracts/common.yaml#/components/responses/Health'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/Health'
  /agents:
    get:
      summary: Catalogo minimo. Contexto opcional para consumidores internos MS-01; credencial obligatoria.
      security:
        - serviceToken: []
      responses:
        '200':
          description: Exactamente Penalista y Civilista, sin configuracion privada.
          content:
            application/json:
              schema:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  $ref: '#/components/schemas/AvailableAgent'
        '401':
          $ref: '../../contracts/common.yaml#/components/responses/Unauthenticated'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/ServiceUnavailable'
  /agents/{id}/availability:
    get:
      summary: Valida disponibilidad vigente para nuevas operaciones; no reserva ni ejecuta preguntas.
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agente habilitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableAgent'
        '401':
          $ref: '../../contracts/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../../contracts/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../../contracts/common.yaml#/components/responses/Conflict'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/ServiceUnavailable'
  /admin/agents:
    get:
      summary: Configuracion vigente de ambos agentes; solo Administrador con identidad verificada.
      responses:
        '200':
          description: Configuraciones sin secretos ni conversaciones.
          content:
            application/json:
              schema:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  $ref: '#/components/schemas/Configuration'
        '401':
          $ref: '../../contracts/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../contracts/common.yaml#/components/responses/Forbidden'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/ServiceUnavailable'
  /admin/agents/{id}/configuration:
    put:
      summary: Publica revision mediante compare-and-set; audita sin incluir instrucciones en el evento.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationInput'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        '400':
          $ref: '../../contracts/common.yaml#/components/responses/Validation'
        '401':
          $ref: '../../contracts/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../contracts/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../contracts/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../../contracts/common.yaml#/components/responses/Conflict'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/ServiceUnavailable'
  /admin/agents/{id}/enabled:
    put:
      summary: Cambia disponibilidad con revision esperada. Permite ambos deshabilitados y no cancela trabajo iniciado.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnabledInput'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        '400':
          $ref: '../../contracts/common.yaml#/components/responses/Validation'
        '401':
          $ref: '../../contracts/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../contracts/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../contracts/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../../contracts/common.yaml#/components/responses/Conflict'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/ServiceUnavailable'
  /admin/agents/{id}/laws:
    parameters: [{ $ref: '#/components/parameters/AgentId' }]
    post:
      summary: Administrador carga Markdown UTF-8 y publica una revision con biblioteca independiente. Hasta 10 archivos y 256 KiB totales; duplicados rechazados y auditoria sin texto legal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, name, base64]
              properties:
                expectedRevision: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 180, pattern: '\.[mM][dD]$' }
                base64: { type: string, minLength: 1, maxLength: 349528, contentEncoding: base64 }
      responses:
        '200': { $ref: '#/components/responses/Change' }
        default: { $ref: '#/components/responses/ChatError' }
  /admin/agents/{id}/laws/{lawId}:
    parameters:
      - { $ref: '#/components/parameters/AgentId' }
      - { name: lawId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Solo Administrador consulta texto de una ley vigente del agente indicado. No renderiza Markdown como HTML.
      responses:
        '200':
          description: Texto UTF-8 y metadatos de la ley.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LawContent' }
        default: { $ref: '#/components/responses/ChatError' }
    delete:
      summary: Retira la ley de nuevas capturas con revision esperada; conserva revisiones inmutables y respuestas previas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Change' }
        default: { $ref: '#/components/responses/ChatError' }
  /admin/agents/{id}/history:
    get:
      summary: Cadena aplicada paginada; cursor firmado ligado al agente, sin revisiones no publicadas.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - name: first
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          schema:
            type: string
            maxLength: 1000
      responses:
        '200':
          description: Historial con anterior y nuevo, autor y fecha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '400':
          $ref: '../../contracts/common.yaml#/components/responses/Validation'
        '401':
          $ref: '../../contracts/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../contracts/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../contracts/common.yaml#/components/responses/NotFound'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    serviceToken:
      $ref: '../../contracts/common.yaml#/components/securitySchemes/serviceToken'
    userContext:
      $ref: '../../contracts/common.yaml#/components/securitySchemes/userContext'
  parameters:
    ChatCaseId: { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        enum: [penalista, civilista]
  schemas:
    ChatAgent:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, enum: [penalista, civilista] }
        name: { type: string }
    ChatSource:
      type: object
      additionalProperties: false
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind: { type: string, enum: [CASE, PDF, LAW] }
        label: { type: string }
    ChatExchange:
      type: object
      additionalProperties: false
      required: [id, question, answer, agent, occurredAt, sources]
      properties:
        id: { type: string, format: uuid }
        question: { type: string, maxLength: 8000 }
        answer: { type: string, maxLength: 50000 }
        agent: { $ref: '#/components/schemas/ChatAgent' }
        occurredAt: { type: string, format: date-time }
        sources: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ChatSource' } }
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, caseId, createdAt, activeAgent, version]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        activeAgent: { $ref: '#/components/schemas/ChatAgent' }
        version: { type: integer, minimum: 1 }
    Conversation:
      type: object
      additionalProperties: false
      required: [id, caseId, createdAt, activeAgent, version, exchanges]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        activeAgent: { $ref: '#/components/schemas/ChatAgent' }
        version: { type: integer, minimum: 1 }
        exchanges: { type: array, items: { $ref: '#/components/schemas/ChatExchange' } }
    AgentTool:
      type: string
      enum: [CASE_LEGAL_DATA, CASE_PDF_LIST, CASE_PDF_TEXT]
    AvailableAgent:
      type: object
      additionalProperties: false
      required: [id, name, specialty, enabled, unavailableReason]
      properties:
        id:
          type: string
          enum: [penalista, civilista]
        name:
          type: string
        specialty:
          type: string
        enabled:
          type: boolean
        unavailableReason:
          type: [string, 'null']
    LawMetadata:
      type: object
      additionalProperties: false
      required: [id, name, size, sha256, authorId, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 262144 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        authorId: { type: string, format: uuid }
        uploadedAt: { type: string, format: date-time }
    LawContent:
      type: object
      additionalProperties: false
      required: [id, name, size, sha256, authorId, uploadedAt, text]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 262144 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        authorId: { type: string, format: uuid }
        uploadedAt: { type: string, format: date-time }
        text: { type: string, minLength: 1, maxLength: 262144 }
    Configuration:
      type: object
      additionalProperties: false
      required: [id, name, specialty, enabled, revision, instructions, model, tools, laws, authorId, occurredAt]
      properties:
        id:
          type: string
          enum: [penalista, civilista]
        name:
          type: string
        specialty:
          type: string
        enabled:
          type: boolean
        revision:
          type: string
          format: uuid
        instructions:
          type: string
          minLength: 1
          maxLength: 20000
        model:
          type: string
          minLength: 1
          maxLength: 200
        tools:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentTool'
        laws:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/LawMetadata' }
        authorId:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
    ConfigurationInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, instructions, model, tools]
      properties:
        expectedRevision:
          type: string
          format: uuid
        instructions:
          type: string
          minLength: 1
          maxLength: 20000
        model:
          type: string
          minLength: 1
          maxLength: 200
        tools:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentTool'
    EnabledInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, enabled]
      properties:
        expectedRevision:
          type: string
          format: uuid
        enabled:
          type: boolean
    Change:
      type: object
      additionalProperties: false
      required: [applied, auditRecorded, category, message, agent]
      properties:
        applied:
          type: boolean
        auditRecorded:
          type: boolean
        category:
          type: [string, 'null']
          enum: [PARTIAL_FAILURE, 'null']
        message:
          type: string
        agent:
          $ref: '#/components/schemas/Configuration'
    History:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [current, previous]
            properties:
              current:
                $ref: '#/components/schemas/Configuration'
              previous:
                oneOf:
                  - $ref: '#/components/schemas/Configuration'
                  - type: 'null'
        pageInfo:
          type: object
          additionalProperties: false
          required: [hasNextPage, endCursor]
          properties:
            hasNextPage:
              type: boolean
            endCursor:
              type: [string, 'null']
  responses:
    ChatError:
      description: Error seguro 400/401/403/404/409/503, sin pregunta, respuesta, contenido de fuente ni trazas.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [category, message]
            properties:
              category: { type: string, enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, SERVICE_UNAVAILABLE] }
              message: { type: string }
    Change:
      description: Cambio aplicado. PARTIAL_FAILURE significa auditoria no confirmada; no repetir la mutacion automaticamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Change'
