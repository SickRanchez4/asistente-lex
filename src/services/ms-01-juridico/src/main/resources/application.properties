spring.application.name=ms-01-juridico

# En ejecución directa, las variables pueden definirse en un archivo .env del componente.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8081}

# PostgreSQL: esquema juridico de la base compartida.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asistente_lex}
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:verify-full}
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_SSLROOTCERT:/certs/postgresql-ca.crt}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
# El servicio arranca aunque PostgreSQL no esté disponible.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.sql.init.mode=never

# DynamoDB: eventos de acceso y auditoría.
asistentelex.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
asistentelex.dynamodb.region=${DYNAMODB_REGION:us-east-1}
asistentelex.dynamodb.access-key-id=${DYNAMODB_ACCESS_KEY_ID:local}
asistentelex.dynamodb.secret-access-key=${DYNAMODB_SECRET_ACCESS_KEY:local}

asistentelex.health.timeout-ms=${HEALTH_CHECK_TIMEOUT_MS:2000}
asistentelex.database.schema=${DB_SCHEMA:juridico}

# Autenticación REST interna (spec 002). Vacías: se rechaza toda llamada salvo GET /health.
asistentelex.internal.api-token=${INTERNAL_API_TOKEN:}
asistentelex.internal.user-context-signing-key=${USER_CONTEXT_SIGNING_KEY:}
asistentelex.internal.ms04-audit-token=${MS04_AUDIT_API_TOKEN:}
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.flyway.enabled=false
asistentelex.auth.prepare=${AUTH_PREPARE:false}
asistentelex.auth.demo=${AUTH_DEMO:false}
asistentelex.auth.environment=${APP_ENV:local}
asistentelex.auth.demo-email=${AUTH_DEMO_EMAIL:admin@demo.com}
asistentelex.auth.demo-password=${AUTH_DEMO_PASSWORD:password}
asistentelex.auth.audit-table=${AUDIT_TABLE:lex-access-events-v1}
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.com.zaxxer.hikari=OFF
