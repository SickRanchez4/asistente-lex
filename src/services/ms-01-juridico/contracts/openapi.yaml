openapi: 3.1.1
info:
  title: MS-01 Jurídico
  version: 1.0.0
  description: |
    Contrato REST vigente de MS-01. Cada spec funcional añade aquí sus operaciones
    antes de integrarlas. Convenciones y errores en ../../contracts/common.yaml.
servers:
  - url: http://localhost:8081
security:
  - serviceToken: []
    userContext: []
paths:
  /cases/{caseId}/participants:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Participaciones del expediente propio en cualquier estado, con Persona vigente minima.
      description: Paginas de 1 a 100 por UUID; cursor ligado a cuenta y expediente. Sin acceso al historial interno ni documento/contacto de Persona. Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/First'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Lista propia; vacia no significa fallo de lectura.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Participant' } }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/ParticipantError' }
        '401': { $ref: '#/components/responses/ParticipantError' }
        '403': { $ref: '#/components/responses/ParticipantError' }
        '404': { $ref: '#/components/responses/ParticipantError' }
        '503': { $ref: '#/components/responses/ParticipantError' }
    post:
      summary: Vincular Persona propia a expediente Abierto; unicidad persona/expediente e historial atomico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [personId, input]
              properties:
                personId: { type: string, format: uuid }
                input: { $ref: '#/components/schemas/ParticipantInput' }
      responses:
        '200': { $ref: '#/components/responses/Participant' }
        '400': { $ref: '#/components/responses/ParticipantError' }
        '401': { $ref: '#/components/responses/ParticipantError' }
        '403': { $ref: '#/components/responses/ParticipantError' }
        '404': { $ref: '#/components/responses/ParticipantError' }
        '409': { $ref: '#/components/responses/ParticipantError' }
        '503': { $ref: '#/components/responses/ParticipantError' }
  /cases/{caseId}/participants/{id}:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Cambiar un unico rol contextual en Abierto con version esperada; no cambia Persona ni servicios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input, expectedVersion]
              properties:
                input: { $ref: '#/components/schemas/ParticipantInput' }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Participant' }
        '400': { $ref: '#/components/responses/ParticipantError' }
        '401': { $ref: '#/components/responses/ParticipantError' }
        '403': { $ref: '#/components/responses/ParticipantError' }
        '404': { $ref: '#/components/responses/ParticipantError' }
        '409': { $ref: '#/components/responses/ParticipantError' }
        '503': { $ref: '#/components/responses/ParticipantError' }
    delete:
      summary: Retira solo la participacion en Abierto; conserva Persona e historial, no consulta ni modifica MS-03.
      parameters:
        - { name: expectedVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Desvinculacion confirmada; repetir no es otra eliminacion exitosa.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, removed]
                properties:
                  id: { type: string, format: uuid }
                  removed: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/ParticipantError' }
        '401': { $ref: '#/components/responses/ParticipantError' }
        '403': { $ref: '#/components/responses/ParticipantError' }
        '404': { $ref: '#/components/responses/ParticipantError' }
        '409': { $ref: '#/components/responses/ParticipantError' }
        '503': { $ref: '#/components/responses/ParticipantError' }
  /cases:
    get:
      summary: Expedientes propios del Abogado vigente; filtros combinables, nunca acepta cuenta del cliente.
      description: Codigo/titulo por subcadena literal sin distinguir mayusculas; sin filtros de fecha. Orden estable por UUID, cursor ligado a cuenta y filtros.
      parameters:
        - $ref: '#/components/parameters/First'
        - $ref: '#/components/parameters/After'
        - { name: state, in: query, schema: { type: string, enum: [OPEN, CLOSED, ARCHIVED] } }
        - { name: area, in: query, schema: { type: string, enum: [CIVIL, PENAL] } }
        - { name: code, in: query, schema: { type: string, maxLength: 100 } }
        - { name: title, in: query, schema: { type: string, maxLength: 300 } }
      responses:
        '200':
          description: Pagina propia, no se confunde vacio con fallo de lectura.
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CaseFile' } }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/CaseError' }
        '403': { $ref: '#/components/responses/CaseError' }
        '503': { $ref: '#/components/responses/CaseError' }
    post:
      summary: Crea Abierto, version 1; valida disponibilidad autoritativa en MS-04 antes de persistir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseInput' }
      responses:
        '200': { $ref: '#/components/responses/CaseFile' }
        '400': { $ref: '#/components/responses/CaseError' }
        '403': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
        '503': { $ref: '#/components/responses/CaseError' }
  /cases/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Ficha propia en cualquier estado; ajena e inexistente son el mismo NOT_FOUND.
      responses:
        '200': { $ref: '#/components/responses/CaseFile' }
        '400': { $ref: '#/components/responses/CaseError' }
        '403': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '503': { $ref: '#/components/responses/CaseError' }
    put:
      summary: Solo Abierto y version esperada; cambiar agente valida disponibilidad y no modifica chats existentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input, expectedVersion]
              properties:
                input: { $ref: '#/components/schemas/CaseInput' }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/CaseFile' }
        '400': { $ref: '#/components/responses/CaseError' }
        '403': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
        '503': { $ref: '#/components/responses/CaseError' }
  /cases/{id}/eligibility:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Proyeccion minima para MS-02/MS-03/MS-04; pertenencia del Abogado verificada en MS-01.
      description: |
        No acepta cuenta como argumento ni devuelve titulo/contenido. questionsAllowed es falso
        cuando archiving=true o state=ARCHIVED. Una lectura no es una reserva distribuida;
        011 debe leer bajo su coordinacion local de admision y comprobar generacion al persistir.
      responses:
        '200':
          description: Estado vigente y elegibilidad tecnica, Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, state, initialAgentId, version, archiving, questionsAllowed]
                properties:
                  id: { type: string, format: uuid }
                  state: { type: string, enum: [OPEN, CLOSED, ARCHIVED] }
                  initialAgentId: { type: string, enum: [civilista, penalista] }
                  version: { type: integer, minimum: 1 }
                  archiving: { type: boolean }
                  questionsAllowed: { type: boolean }
        '400': { $ref: '#/components/responses/CaseError' }
        '403': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '503': { $ref: '#/components/responses/CaseError' }
  /cases/{id}/transitions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Historial paginado propio por version, con anterior/nuevo/fecha/autor.
      parameters:
        - $ref: '#/components/parameters/First'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Solo cambios efectivos; cursor ligado a cuenta y expediente.
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CaseTransition' } }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/CaseError' }
        '403': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '503': { $ref: '#/components/responses/CaseError' }
    post:
      summary: Ejecuta CLOSE/REOPEN/ARCHIVE/UNARCHIVE con version esperada; sin transaccion SQL durante REST.
      description: |
        ARCHIVE requiere confirmConversationDeletion=true. Persiste intento tecnico estable y
        bloquea admision antes de pedir borrado a MS-04; solo despues guarda Archivado/historial.
        Ante incertidumbre conserva CLOSED + archiving; reintentar reutiliza el intento.
        Desarchivar lleva a CLOSED sin restaurar chats ni escribir contenido/documentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, expectedVersion]
              properties:
                action: { type: string, enum: [CLOSE, REOPEN, ARCHIVE, UNARCHIVE] }
                expectedVersion: { type: integer, minimum: 1 }
                confirmConversationDeletion: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/CaseFile' }
        '400': { $ref: '#/components/responses/CaseError' }
        '403': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
        '502': { $ref: '#/components/responses/CaseError' }
        '503': { $ref: '#/components/responses/CaseError' }
  /people:
    get:
      summary: Lista personas de la cuenta del Abogado vigente; nunca acepta cuenta del cliente.
      description: |
        Filtros combinables. name y document son subcadenas literales sin distinguir
        mayusculas/minusculas; document busca el numero, no la terna. Orden estable por UUID.
        Cursor opaco ligado a cuenta y filtros. Errores de lectura nunca son paginas vacias.
      parameters:
        - $ref: '#/components/parameters/First'
        - $ref: '#/components/parameters/After'
        - { name: name, in: query, schema: { type: string, maxLength: 300 } }
        - { name: type, in: query, schema: { type: string, enum: [NATURAL, LEGAL] } }
        - { name: document, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Pagina propia, hasta 100 fichas.
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Person' } }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/PersonError' }
        '403': { $ref: '#/components/responses/PersonError' }
        '503': { $ref: '#/components/responses/PersonError' }
    post:
      summary: Registra persona propia; no recibe identificador, cuenta ni roles de participacion.
      requestBody: { $ref: '#/components/requestBodies/PersonInput' }
      responses:
        '200':
          description: Ficha persistida con identificador estable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/PersonError' }
        '403': { $ref: '#/components/responses/PersonError' }
        '409': { $ref: '#/components/responses/PersonError' }
        '503': { $ref: '#/components/responses/PersonError' }
  /people/selections:
    get:
      summary: Proyeccion minima para 008 y 014, mismos filtros/cursor y autorizacion que GET /people.
      parameters:
        - $ref: '#/components/parameters/First'
        - $ref: '#/components/parameters/After'
        - { name: name, in: query, schema: { type: string, maxLength: 300 } }
        - { name: type, in: query, schema: { type: string, enum: [NATURAL, LEGAL] } }
        - { name: document, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Solo id, type y displayName; sin documento ni contacto.
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PersonSelection' } }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/PersonError' }
        '403': { $ref: '#/components/responses/PersonError' }
        '503': { $ref: '#/components/responses/PersonError' }
  /people/{id}/selection:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Valida existencia y pertenencia para 008/014 sin documentos ni contacto.
      responses:
        '200':
          description: Proyeccion minima vigente, exige Abogado propietario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonSelection' }
        '400': { $ref: '#/components/responses/PersonError' }
        '403': { $ref: '#/components/responses/PersonError' }
        '404': { $ref: '#/components/responses/PersonError' }
        '503': { $ref: '#/components/responses/PersonError' }
  /people/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Ficha vigente propia; ajena e inexistente responden el mismo NOT_FOUND.
      responses:
        '200':
          description: Ficha completa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/PersonError' }
        '403': { $ref: '#/components/responses/PersonError' }
        '404': { $ref: '#/components/responses/PersonError' }
        '503': { $ref: '#/components/responses/PersonError' }
    put:
      summary: Sustituye datos de ficha propia sin cambiar id ni consultar/modificar participaciones.
      requestBody: { $ref: '#/components/requestBodies/PersonInput' }
      responses:
        '200':
          description: Ficha vigente persistida; identificacion ausente se representa con null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/PersonError' }
        '403': { $ref: '#/components/responses/PersonError' }
        '404': { $ref: '#/components/responses/PersonError' }
        '409': { $ref: '#/components/responses/PersonError' }
        '503': { $ref: '#/components/responses/PersonError' }
  /public/settings:
    get:
      summary: Proyección pública cerrada, solo mensaje global y correo de soporte.
      security:
        - serviceToken: []
      responses:
        '200':
          description: Ambos valores opcionales se representan como cadenas vacías.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettings'
  /admin/accounts:
    get:
      summary: Lista exclusivamente cuentas Abogado; exige Administrador vigente.
      parameters:
        - $ref: '#/components/parameters/First'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Página ordenada por correo único, sin hashes ni contenido jurídico.
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminAccount' } }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
    post:
      summary: Crea Abogado activo; no acepta rol ni estado del cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, description: Entre 1 y 72 bytes UTF-8. }
      responses:
        '200': { $ref: '#/components/responses/AdminChange' }
  /admin/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      summary: Consulta una cuenta Abogado; inexistente o de otro rol devuelve NOT_FOUND.
      responses:
        '200':
          description: Solo datos de cuenta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
  /admin/accounts/{id}/enabled:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    put:
      summary: Suspende o reactiva; suspensión e invalidación de sesiones son una transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/AdminChange' }
  /admin/accounts/{id}/password:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    put:
      summary: Restablece contraseña propia de la cuenta sin devolver ni auditar el secreto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, description: Entre 1 y 72 bytes UTF-8. }
      responses:
        '200': { $ref: '#/components/responses/AdminChange' }
  /admin/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, enum: [GLOBAL_MESSAGE, SUPPORT_EMAIL] }
    put:
      summary: Actualiza parámetro cerrado; captura anterior/nuevo en la misma transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/AdminChange' }
  /admin/audit-events:
    get:
      summary: Solo lectura; query DynamoDB acotada, nunca scan ilimitado.
      description: |
        Fechas RFC3339 con zona, normalizadas a UTC. from inclusivo, until exclusivo.
        first 1..100 (25 por defecto). Cursor opaco ligado a filtros; una página puede
        estar vacía y tener continuación si el filtro descarta los registros evaluados.
      parameters:
        - $ref: '#/components/parameters/First'
        - $ref: '#/components/parameters/After'
        - { name: type, in: query, schema: { type: string, enum: [LOGIN, LOGIN_FAILED, LOGOUT, ACCESS_DENIED, PASSWORD_CHANGED, ADMIN_CHANGE, AGENT_ACTION, AI_ACTION] } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Página con atributos públicos del evento y pageInfo; no existe edición/borrado.
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
  /auth/login:
    post:
      summary: Valida credenciales y crea una sesión opaca de servidor.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 72 }
      responses:
        '200':
          $ref: '#/components/responses/AuthResult'
  /auth/verify:
    post:
      summary: Verifica sesión y cuenta; solo actividad explícita renueva inactividad.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, active]
              properties:
                token: { type: string }
                active: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/AuthResult'
  /auth/logout:
    post:
      summary: Invalida la sesión antes de intentar registrar auditoría.
      security:
        - serviceToken: []
      requestBody:
        $ref: '#/components/requestBodies/SessionToken'
      responses:
        '200':
          $ref: '#/components/responses/AuthResult'
  /auth/password:
    post:
      summary: Cambia únicamente la contraseña de la sesión verificada; exige contraseña actual.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, currentPassword, newPassword]
              properties:
                token: { type: string }
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 1, maxLength: 72 }
      responses:
        '200':
          $ref: '#/components/responses/AuthResult'
  /auth/denial:
    post:
      summary: Registra denegación; obtiene usuario de sesión, no del cuerpo del cliente.
      security:
        - serviceToken: []
      requestBody:
        $ref: '#/components/requestBodies/SessionToken'
      responses:
        '200':
          $ref: '#/components/responses/AuthResult'
  /audit/events:
    post:
      summary: Recepción de MS-04; autor firmado vigente y reenvío idempotente sin duplicar cambios.
      security:
        - ms04AuditToken: []
          userContext: []
      description: |
        MS-04 usa MS04_AUDIT_API_TOKEN, distinta del token de Gateway a MS-01.
        AGENT_ACTION requiere Administrador, resultado SUCCESS, operation, agentId y date
        originales y estables en cada reenvío. No recibe instrucciones ni conversaciones.
        El reenvío solo intenta registrar; nunca reejecuta el cambio del agente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, type, result]
              properties:
                eventId: { type: string, pattern: '^[a-zA-Z0-9-]{1,100}$' }
                type: { type: string, enum: [ACCESS_DENIED, AGENT_ACTION, AI_ACTION] }
                result: { type: string, enum: [SUCCESS, REJECTED, PARTIAL_FAILURE] }
                operation: { type: string, enum: [AGENT_CONFIGURATION_CHANGED, AGENT_ENABLED, AGENT_DISABLED] }
                agentId: { type: string, enum: [penalista, civilista] }
                date: { type: string, format: date-time }
      responses:
        '200':
          description: |
            AGENT_ACTION devuelve applied/auditRecorded/category/message (AdminChange).
            AI_ACTION y ACCESS_DENIED devuelven success/auditRecorded/category/message (AuthResult).
            Un duplicado idéntico es reconocido; contenido distinto con la misma referencia
            no se considera registrado y se comunica PARTIAL_FAILURE.
          content:
            application/json:
              schema:
                type: object
                required: [auditRecorded]
                properties:
                  applied: { type: boolean }
                  success: { type: boolean }
                  auditRecorded: { type: boolean }
                  category: { type: [string, 'null'] }
                  message: { type: [string, 'null'] }
  /health:
    get:
      summary: Comprobación técnica de PostgreSQL y DynamoDB.
      security: []
      responses:
        '200':
          $ref: '../../contracts/common.yaml#/components/responses/Health'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/Health'
components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    First:
      name: first
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    After:
      name: after
      in: query
      schema: { type: string, maxLength: 4096 }
  schemas:
    ParticipantInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [REPRESENTED_PERSON, COUNTERPARTY, WITNESS, REPRESENTATIVE, OTHER] }
        detail: { type: [string, 'null'], maxLength: 2000, description: Obligatorio y no vacio para OTHER; se recorta. En los otros roles se normaliza a null. }
      allOf:
        - if:
            properties:
              role: { const: OTHER }
          then:
            required: [detail]
            properties:
              detail: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
    Participant:
      type: object
      additionalProperties: false
      required: [id, person, role, detail, version]
      properties:
        id: { type: string, format: uuid }
        person: { $ref: '#/components/schemas/PersonSelection' }
        role: { type: string, enum: [REPRESENTED_PERSON, COUNTERPARTY, WITNESS, REPRESENTATIVE, OTHER] }
        detail: { type: [string, 'null'], maxLength: 2000 }
        version: { type: integer, minimum: 1 }
    CaseInput:
      type: object
      additionalProperties: false
      required: [code, title, area, initialAgentId]
      properties:
        code: { type: string, minLength: 1, maxLength: 100, description: Texto; conservar ceros y comparar lower(btrim(code)) dentro de la cuenta. }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 10000 }
        area: { type: string, enum: [CIVIL, PENAL] }
        initialAgentId: { type: string, enum: [civilista, penalista] }
    CaseFile:
      type: object
      additionalProperties: false
      required: [id, code, title, description, area, initialAgentId, state, version, archiving]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 10000 }
        area: { type: string, enum: [CIVIL, PENAL] }
        initialAgentId: { type: string, enum: [civilista, penalista] }
        state: { type: string, enum: [OPEN, CLOSED, ARCHIVED] }
        version: { type: integer, minimum: 1 }
        archiving: { type: boolean }
    CaseTransition:
      type: object
      additionalProperties: false
      required: [id, previousState, newState, date, authorId, version]
      properties:
        id: { type: string, format: uuid }
        previousState: { type: string, enum: [OPEN, CLOSED, ARCHIVED] }
        newState: { type: string, enum: [OPEN, CLOSED, ARCHIVED] }
        date: { type: string, format: date-time }
        authorId: { type: string, format: uuid }
        version: { type: integer, minimum: 2 }
    PersonInput:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        NATURAL requiere firstNames/lastNames; LEGAL requiere businessName.
        Campos del otro tipo se limpian. Identificacion vacia o terna completa.
        Se quitan espacios exteriores, conservando ceros y grafia; la comparacion
        autoritativa usa lower(btrim(campo)) en PostgreSQL, igual en consulta e indice.
        Contacto opcional sin validacion externa. No se admiten caracteres de control.
      properties:
        type: { type: string, enum: [NATURAL, LEGAL] }
        firstNames: { type: [string, 'null'], maxLength: 200 }
        lastNames: { type: [string, 'null'], maxLength: 200 }
        businessName: { type: [string, 'null'], maxLength: 300 }
        documentType: { type: [string, 'null'], maxLength: 100 }
        documentNumber: { type: [string, 'null'], maxLength: 100 }
        issuingCountry: { type: [string, 'null'], maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 100 }
        email: { type: [string, 'null'], maxLength: 254 }
        address: { type: [string, 'null'], maxLength: 1000 }
    Person:
      type: object
      additionalProperties: false
      required: [id, type, displayName, firstNames, lastNames, businessName, documentType, documentNumber, issuingCountry, phone, email, address]
      properties:
        type: { type: string, enum: [NATURAL, LEGAL] }
        firstNames: { type: [string, 'null'], maxLength: 200 }
        lastNames: { type: [string, 'null'], maxLength: 200 }
        businessName: { type: [string, 'null'], maxLength: 300 }
        documentType: { type: [string, 'null'], maxLength: 100 }
        documentNumber: { type: [string, 'null'], maxLength: 100 }
        issuingCountry: { type: [string, 'null'], maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 100 }
        email: { type: [string, 'null'], maxLength: 254 }
        address: { type: [string, 'null'], maxLength: 1000 }
        id: { type: string, format: uuid }
        displayName: { type: string }
    PersonSelection:
      type: object
      additionalProperties: false
      required: [id, type, displayName]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [NATURAL, LEGAL] }
        displayName: { type: string }
    AdminAccount:
      type: object
      additionalProperties: false
      required: [id, name, email, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        enabled: { type: boolean }
    ApplicationSettings:
      type: object
      additionalProperties: false
      required: [globalMessage, supportEmail]
      properties:
        globalMessage: { type: string, maxLength: 1000 }
        supportEmail: { type: string, maxLength: 254 }
    PageInfo:
      type: object
      required: [hasNextPage, endCursor]
      properties:
        hasNextPage: { type: boolean }
        endCursor: { type: [string, 'null'] }
    AuditEvent:
      type: object
      required: [id, type, date, result]
      properties:
        id: { type: string }
        type: { type: string }
        date: { type: string, format: date-time }
        userId: { type: [string, 'null'] }
        result: { type: string }
        operation: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        parameter: { type: [string, 'null'], enum: [GLOBAL_MESSAGE, SUPPORT_EMAIL, null] }
        previousValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        agentId: { type: [string, 'null'] }
  requestBodies:
    PersonInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonInput' }
    SessionToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
  responses:
    Participant:
      description: Participacion vigente, sin cuenta ni contenido privado de Persona.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Participant' }
    ParticipantError:
      description: Error seguro; persona/participacion/expediente ajenos o ausentes son NOT_FOUND. CONFLICT ante duplicado, version o estado no editable. Sin cambios parciales.
      content:
        application/json:
          schema:
            type: object
            required: [category, message]
            properties:
              category: { type: string, enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, SERVICE_UNAVAILABLE] }
              message: { type: string }
              fields:
                type: array
                items:
                  type: object
                  required: [field, message]
                  properties:
                    field: { type: string }
                    message: { type: string }
    CaseFile:
      description: Ficha vigente propia, sin cuenta ni marca interna de intento.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CaseFile' }
    CaseError:
      description: |
        VALIDATION/CONFLICT incluyen campos seguros cuando corresponde; nunca SQL ni datos ajenos.
        SERVICE_UNAVAILABLE no confirma eliminacion ni archivo. PARTIAL_FAILURE (502) indica
        borrado confirmado pero transicion no confirmada: consultar estado antes de reintentar.
      content:
        application/json:
          schema:
            type: object
            required: [category, message]
            properties:
              category: { type: string, enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, SERVICE_UNAVAILABLE, PARTIAL_FAILURE] }
              message: { type: string }
              fields:
                type: array
                items:
                  type: object
                  required: [field, message]
                  properties:
                    field: { type: string }
                    message: { type: string }
    PersonError:
      description: |
        Categorias comunes; VALIDATION y CONFLICT incluyen fields (field/message).
        CONFLICT no incluye documentos completos ni datos de fichas propias o ajenas.
        UNAUTHENTICATED para contexto ausente, FORBIDDEN para rol no Abogado.
      content:
        application/json:
          schema:
            type: object
            required: [category, message]
            properties:
              category: { type: string, enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, SERVICE_UNAVAILABLE] }
              message: { type: string }
              fields:
                type: array
                items:
                  type: object
                  required: [field, message]
                  properties:
                    field: { type: string }
                    message: { type: string }
    AdminChange:
      description: |
        applied=true confirma el cambio. Si falla DynamoDB después del commit,
        auditRecorded=false y category=PARTIAL_FAILURE; no repetir el cambio.
        Errores de acceso/validación/inexistente/conflicto usan Error común y HTTP 4xx.
      content:
        application/json:
          schema:
            type: object
            required: [applied, auditRecorded]
            properties:
              applied: { type: boolean }
              auditRecorded: { type: boolean }
              category: { type: [string, 'null'] }
              message: { type: [string, 'null'] }
              account: { oneOf: [{ $ref: '#/components/schemas/AdminAccount' }, { type: 'null' }] }
              settings: { oneOf: [{ $ref: '#/components/schemas/ApplicationSettings' }, { type: 'null' }] }
    AuthResult:
      description: |
        Resultado explícito, también para credenciales inválidas o suspensión. Un 401
        se reserva para autenticación interna rechazada. Un fallo de almacén es 503
        con Error común. auditRecorded=false no revierte login/logout ni rechazos.
        token solo viaja a Gateway por REST y nunca al esquema GraphQL.
      content:
        application/json:
          schema:
            type: object
            required: [success, auditRecorded]
            properties:
              success: { type: boolean }
              auditRecorded: { type: boolean }
              token: { type: [string, 'null'] }
              category: { type: [string, 'null'] }
              message: { type: [string, 'null'] }
              user:
                type: [object, 'null']
                required: [userId, accountId, role, name]
                properties:
                  userId: { type: string }
                  accountId: { type: string }
                  role: { type: string, enum: [ABOGADO, ADMINISTRADOR] }
                  name: { type: string }
  securitySchemes:
    ms04AuditToken:
      type: http
      scheme: bearer
      description: Credencial exclusiva MS-04 a MS-01, configurada fuera del código como MS04_AUDIT_API_TOKEN.
    serviceToken:
      $ref: '../../contracts/common.yaml#/components/securitySchemes/serviceToken'
    userContext:
      $ref: '../../contracts/common.yaml#/components/securitySchemes/userContext'
