openapi: 3.1.1
info:
  title: MS-02 Documental
  version: 1.0.0
  description: |
    Contrato REST vigente de MS-02. Cada spec funcional añade aquí sus operaciones
    antes de integrarlas. Convenciones y errores en ../../contracts/common.yaml.
servers:
  - url: http://localhost:8082
security:
  - serviceToken: []
    userContext: []
paths:
  /cases/{caseId}/reports:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      summary: Historico inmutable completo, separado de files y file-sources; manifiesto para 013.
      parameters:
        - { name: first, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: after, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'items con id,caseId,requestId,kind,createdAt,size,title,agent; pageInfo con hasNextPage/endCursor. Orden fecha/ID descendente. No incluye STAGING.', content: { application/json: { schema: { type: object } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Generar PDF completo en OPEN/CLOSED; presupuesto total 60000 ms. Sin regeneracion automatica.
      description: requestId unico por cuenta/expediente y huella de entrada; repetir confirmado retorna el mismo informe, entrada distinta o STAGING da conflicto. Si se pierde confirmacion consultar solicitud/historico. CLIENT excluye documentos desde origen. STAGING nunca publicable, COMPLETE inmutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, kind]
              properties:
                requestId: { type: string, format: uuid }
                kind: { type: string, enum: [EXECUTIVE, CLIENT, NATURAL] }
                agentId: { type: [string, 'null'], enum: [civilista, penalista, null] }
                question: { type: [string, 'null'], maxLength: 8000 }
                documentIds: { type: [array, 'null'], maxItems: 10, items: { type: string, format: uuid } }
                filter: { type: [object, 'null'], additionalProperties: false, properties: { actuationType: { type: [string, 'null'], enum: [HEARING, FILING, DECISION, NOTIFICATION, OTHER, null] }, fromDate: { type: [string, 'null'], format: date }, toDate: { type: [string, 'null'], format: date } } }
      responses:
        '200': { description: Informe confirmado, content: { application/json: { schema: { $ref: '#/components/schemas/SavedReport' } } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/reports/requests/{requestId}:
    parameters: [{ $ref: '#/components/parameters/CaseId' }, { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Recuperar resultado confirmado sin regenerar; 404 ausente y 409 no confirmado.
      responses:
        '200': { description: Informe confirmado, content: { application/json: { schema: { $ref: '#/components/schemas/SavedReport' } } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/reports/{reportId}:
    parameters: [{ $ref: '#/components/parameters/CaseId' }, { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Informe guardado autorizado en cualquier estado, incluido ARCHIVED. Sin PUT/PATCH/DELETE.
      responses:
        '200': { description: Informe completo, content: { application/json: { schema: { $ref: '#/components/schemas/SavedReport' } } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/reports/{reportId}/{format}:
    parameters: [{ $ref: '#/components/parameters/CaseId' }, { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }, { name: format, in: path, required: true, schema: { type: string, enum: [content, csv] } }]
    get:
      summary: PDF o CSV Base64 guardados, sin regenerar; contenido autorizado para 013.
      description: CSV UTF-8 BOM, punto y coma, comillas escapadas, dd/MM/yyyy y coma decimal sin miles. TEXT/cabeceras con formula potencial reciben apostrofo protector; apostrofo inicial se duplica. Tabla original permanece intacta. Solo si hay tabla; CSV no es formato narrativo.
      responses:
        '200': { description: Contenido protegido, content: { application/json: { schema: { $ref: '#/components/schemas/Content' } } } }
        default: { $ref: '#/components/responses/Error' }
  /health:
    get:
      summary: Comprobación técnica de PostgreSQL y del almacenamiento de archivos.
      security: []
      responses:
        '200':
          $ref: '../../contracts/common.yaml#/components/responses/Health'
        '503':
          $ref: '../../contracts/common.yaml#/components/responses/Health'
  /cases/{caseId}/files:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      summary: Metadatos propios, sin informes ni cargas STAGING. DELETE_PENDING no admite apertura.
      description: |
        Abogado vigente autorizado por MS-01 en cualquier estado. Cache-Control no-store.
        Orden uploadedAt DESC, id DESC; fecha civil inclusiva en America/La_Paz.
        Nombre por subcadena literal sin distinguir mayusculas. Cursor ligado a cuenta/caso/filtros.
      parameters:
        - { name: first, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: after, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: name, in: query, schema: { type: string, maxLength: 180 } }
        - { name: classification, in: query, schema: { type: string, enum: [FILING, DECISION, EVIDENCE, OTHER] } }
        - { name: format, in: query, schema: { type: string, enum: [PDF, JPEG, PNG] } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Pagina autorizada, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Un original PDF/JPEG/PNG de hasta 10485760 bytes con clasificacion obligatoria.
      description: |
        Valida propietario vigente, OPEN y ausencia de archivo pendiente en MS-01 sin cache.
        JSON maximo 14680064 bytes; plazo total 60000 ms. No promete atomicidad con cierre remoto.
        Comprueba Base64 canonico, extension/MIME y apertura completa del formato.
        STAGING nunca visible; AVAILABLE solo tras confirmar binario y metadatos.
        Fotografias conservan bytes y EXIF, sin exponerlos por separado. Sin reemplazo.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } }
      responses:
        '200': { description: Binario y metadatos confirmados, content: { application/json: { schema: { $ref: '#/components/schemas/File' } } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/files/{id}:
    parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/FileId' }]
    get:
      summary: Metadatos autorizados en cualquier estado, sin rutas internas.
      responses:
        '200': { description: Metadatos, content: { application/json: { schema: { $ref: '#/components/schemas/File' } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      summary: Reclasificar solo OPEN tras validar MS-01, sin cambiar bytes ni fecha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [classification, expectedVersion]
              properties:
                classification: { type: string, enum: [FILING, DECISION, EVIDENCE, OTHER] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Clasificacion vigente, content: { application/json: { schema: { $ref: '#/components/schemas/File' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Borrar solo OPEN con confirmacion irreversible y version, sin reemplazo.
      description: |
        Persiste DELETE_PENDING antes del borrado: ningun acceso a bytes desde entonces.
        200 confirma binario y metadatos retirados; 202 significa limpieza pendiente, no exito global.
        Repetir ID/version pendiente intenta solo limpieza autorizada; sin reintento automatico.
        No modifica informes inmutables ni copias anteriores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, expectedVersion]
              properties:
                confirm: { type: boolean, const: true }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Eliminacion completa, content: { application/json: { schema: { $ref: '#/components/schemas/Deletion' } } } }
        '202': { description: Borrado incompleto sin acceso al binario, content: { application/json: { schema: { $ref: '#/components/schemas/Deletion' } } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/files/{id}/content:
    parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/FileId' }]
    get:
      summary: Original Base64 autorizado y no-store; sin enlaces publicos ni transformacion EXIF.
      responses:
        '200': { description: Bytes originales, content: { application/json: { schema: { $ref: '#/components/schemas/Content' } } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/files/{id}/pdf-text:
    parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/FileId' }]
    get:
      summary: Texto PDF autorizado para consumidores internos, sin busqueda ni OCR.
      description: Maximo 200000 caracteres. NO_TEXT o LIMIT_EXCEEDED no afirman analisis ni devuelven texto parcial. Rechaza fotografias y PDFs protegidos o ilegibles.
      responses:
        '200': { description: Extraccion explicita, content: { application/json: { schema: { $ref: '#/components/schemas/PdfText' } } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/file-sources:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      summary: Fuentes documentales para 011/012/013, solo AVAILABLE, nunca informes guardados.
      description: Misma paginacion y filtros de files. Contenido y texto PDF requieren las lecturas autorizadas separadas.
      responses:
        '200': { description: Fuentes paginadas, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        default: { $ref: '#/components/responses/Error' }
components:
  schemas:
    SavedReport:
      type: object
      additionalProperties: false
      required: [id, caseId, requestId, kind, createdAt, size, title, sections, table, sources, agent]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        kind: { type: string, enum: [EXECUTIVE, CLIENT, NATURAL] }
        createdAt: { type: string, format: date-time }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        title: { type: string, maxLength: 180 }
        sections: { type: array, minItems: 1, maxItems: 12, items: { type: object, required: [heading, body], properties: { heading: { type: string, maxLength: 150 }, body: { type: string, maxLength: 12000 } }, additionalProperties: false } }
        table:
          type: [object, 'null']
          additionalProperties: false
          required: [columns, rows]
          properties:
            columns: { type: array, minItems: 1, maxItems: 12, items: { type: object, required: [key, label, type], properties: { key: { type: string }, label: { type: string }, type: { type: string, enum: [TEXT, DATE, AMOUNT, NUMBER, BOOLEAN] } }, additionalProperties: false } }
            rows: { type: array, maxItems: 200, items: { type: array, items: { type: string, maxLength: 2000 } } }
        sources: { type: array, items: { type: object, required: [id, kind, label], properties: { id: { type: string }, kind: { type: string, enum: [CASE, PDF, LAW] }, label: { type: string } }, additionalProperties: false } }
        agent: { type: object, required: [id, name], properties: { id: { type: string, enum: [civilista, penalista] }, name: { type: string } }, additionalProperties: false }
    File:
      type: object
      additionalProperties: false
      required: [id, name, format, size, uploadedAt, classification, version, availability]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 180 }
        format: { type: string, enum: [PDF, JPEG, PNG] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        uploadedAt: { type: string, format: date-time }
        classification: { type: string, enum: [FILING, DECISION, EVIDENCE, OTHER] }
        version: { type: integer, minimum: 1 }
        availability: { type: string, enum: [AVAILABLE, DELETE_PENDING] }
    Upload:
      type: object
      additionalProperties: false
      required: [name, contentType, base64, classification]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        base64: { type: string, minLength: 4, maxLength: 13981016 }
        classification: { type: string, enum: [FILING, DECISION, EVIDENCE, OTHER] }
    Page:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/File' } }
        pageInfo:
          type: object
          required: [hasNextPage, endCursor]
          properties:
            hasNextPage: { type: boolean }
            endCursor: { type: [string, 'null'] }
    Content:
      type: object
      additionalProperties: false
      required: [name, contentType, base64, size]
      properties:
        name: { type: string }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        base64: { type: string, maxLength: 13981016 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    PdfText:
      type: object
      additionalProperties: false
      required: [status, text]
      properties:
        status: { type: string, enum: [EXTRACTED, NO_TEXT, LIMIT_EXCEEDED] }
        text: { type: [string, 'null'], maxLength: 200000 }
    Deletion:
      type: object
      additionalProperties: false
      required: [deleted, cleanupPending]
      properties:
        deleted: { type: boolean }
        cleanupPending: { type: boolean }
  parameters:
    CaseId: { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    FileId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Error seguro sin nombres, contenido ni rutas; categorias de spec 002.
      content:
        application/json:
          schema: { $ref: '../../contracts/common.yaml#/components/schemas/Error' }
  securitySchemes:
    serviceToken:
      $ref: '../../contracts/common.yaml#/components/securitySchemes/serviceToken'
    userContext:
      $ref: '../../contracts/common.yaml#/components/securitySchemes/userContext'
