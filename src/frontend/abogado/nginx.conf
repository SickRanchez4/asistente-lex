# Sirve el paquete del microfrontend para que lo cargue el Application Shell.
server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin "*" always;

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
