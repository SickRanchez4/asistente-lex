# Las rutas de los microfrontends (/abogado, /admin) se resuelven en el navegador.
server {
    listen 80;
    root /usr/share/nginx/html;

    location = /graphql {
        proxy_pass http://gateway:4000/graphql;
        client_max_body_size 14680064;
        proxy_read_timeout 65s;
    }

    location / {
        try_files $uri /index.html;
    }
}
