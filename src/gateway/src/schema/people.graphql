enum PersonType { NATURAL LEGAL }

input PersonInput {
  type: PersonType!
  firstNames: String
  lastNames: String
  businessName: String
  documentType: String
  documentNumber: String
  issuingCountry: String
  phone: String
  email: String
  address: String
}
input PersonFilter { name: String type: PersonType document: String }
type Person {
  id: ID!
  type: PersonType!
  firstNames: String
  lastNames: String
  businessName: String
  displayName: String!
  documentType: String
  documentNumber: String
  issuingCountry: String
  phone: String
  email: String
  address: String
}
type PersonSelection { id: ID! type: PersonType! displayName: String! }
type PersonPage { items: [Person!]! pageInfo: PageInfo! }
type PersonSelectionPage { items: [PersonSelection!]! pageInfo: PageInfo! }
extend type Query {
  people(first: Int! = 25, after: String, filter: PersonFilter): PersonPage!
  person(id: ID!): Person!
  personSelection(id: ID!): PersonSelection!
  personSelections(first: Int! = 25, after: String, filter: PersonFilter): PersonSelectionPage!
}
extend type Mutation {
  createPerson(input: PersonInput!): Person!
  updatePerson(id: ID!, input: PersonInput!): Person!
}